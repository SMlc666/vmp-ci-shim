name: CI

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to test'
        required: true
        type: string
      branch:
        description: 'Branch name (for context)'
        required: false
        type: string
        default: 'main'

concurrency:
  group: ${{ github.event.inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  public_demo:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path examples/hello-arm64/Cargo.toml --quiet

  private_glibc:
    runs-on: ubuntu-24.04-arm
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - id: test
        name: Run cargo test
        working-directory: src
        run: |
          cargo test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          sed -i "s|/home/runner/work/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-glibc-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7

  private_bionic:
    runs-on: ubuntu-24.04-arm
    container:
      image: termux/termux-docker:aarch64
      # --dns 8.8.8.8 bypasses termux container's broken default resolv.conf.
      # No webfactory/ssh-agent / upload-artifact actions used in this job
      # because termux image lacks /__e/node20/bin/node, breaking JS actions.
      options: --user 1000:1000 --dns 8.8.8.8 --dns 1.1.1.1
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Diagnose container environment
        run: |
          echo "=== id ==="; id
          echo "=== resolv.conf ==="; cat /etc/resolv.conf 2>&1 || echo "(missing)"
          echo "=== DNS test (nslookup unavailable, use getent) ==="
          getent hosts github.com 2>&1 || echo "FAIL: github.com DNS"
          getent hosts packages-cf.termux.dev 2>&1 || echo "FAIL: termux mirror DNS"
          echo "=== curl github with -v (visible failure) ==="
          curl -v --max-time 10 -o /dev/null -s -w "code=%{http_code}\n" https://github.com 2>&1 | tail -10

      - name: Install build deps via apt
        run: |
          # Default sources.list already points at packages-cf.termux.dev.
          # Just update + install.
          apt update -y 2>&1 | tail -15
          apt install -y rust git openssh 2>&1 | tail -10
          echo "=== rust version ==="
          rustc --version || echo "FAIL: rust not installed"

      - name: Manual SSH setup (no actions in container)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com 2>/dev/null >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ls -la ~/.ssh/

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "$COMMIT_SHA"

      - id: test
        name: Run cargo test
        working-directory: src
        run: |
          cargo test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          sed -i "s|/data/data/com.termux/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

  notify_failure:
    needs: [private_glibc, private_bionic]
    if: failure()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Send Telegram alert
        env:
          GLIBC: ${{ needs.private_glibc.result }}
          BIONIC: ${{ needs.private_bionic.result }}
          FAILS_GLIBC: ${{ needs.private_glibc.outputs.failures }}
          FAILS_BIONIC: ${{ needs.private_bionic.outputs.failures }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use printf with %s args (NOT heredoc) so backticks/$() in failure
          # output don't trigger command substitution. Inputs are read from env,
          # not interpolated into script source — prevents injection.
          MSG=$(printf 'CI failed\nbranch: %s\nsha:    %s\nglibc:  %s\nbionic: %s\n\n--- glibc failures ---\n%s\n\n--- bionic failures ---\n%s\n\nRun: %s\n' \
            "$BRANCH" "$SHA" "$GLIBC" "$BIONIC" "$FAILS_GLIBC" "$FAILS_BIONIC" "$RUN_URL")

          if [ ${#MSG} -gt 4000 ]; then
            MSG="${MSG:0:1800}"$'\n[... truncated ...]\n'"${MSG: -1800}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
