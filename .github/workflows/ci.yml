name: CI

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to test'
        required: true
        type: string
      branch:
        description: 'Branch name (for context)'
        required: false
        type: string
        default: 'main'

concurrency:
  group: ${{ github.event.inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  public_demo:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path examples/hello-arm64/Cargo.toml --quiet

  private_glibc:
    runs-on: ubuntu-24.04-arm
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - id: test
        name: Run cargo test
        working-directory: src
        run: |
          cargo test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          sed -i "s|/home/runner/work/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-glibc-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7

  # Bionic job runs on HOST (not container:) so GHA actions work (Node20).
  # Cargo test step explicitly invokes `docker run --network host` to enter
  # termux/bionic, bypassing GHA's container-DNS-proxy limitation.
  private_bionic:
    runs-on: ubuntu-24.04-arm
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout (on host)
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - name: Pre-pull termux image (timing isolated)
        run: docker pull termux/termux-docker:aarch64

      - id: test
        name: Run cargo test inside termux (host network)
        run: |
          # chown so UID 1000 (termux 'system' user) can read/write the mount
          sudo chown -R 1000:1000 src
          mkdir -p /tmp/bionic-out
          sudo chown 1000:1000 /tmp/bionic-out

          # Image's USER directive drops to UID 1000 (system) automatically.
          # No --user override, no su. --network host shares host's network stack.
          # We chown the mounted dirs from host BEFORE entering container so
          # UID 1000 can write to them.
          docker run --rm \
            --network host \
            -v "$PWD/src:/data/data/com.termux/files/home/src" \
            -v /tmp/bionic-out:/data/data/com.termux/files/home/out \
            termux/termux-docker:aarch64 \
            sh -c '
              echo "=== id ==="; id
              echo "=== resolv.conf ==="; cat /etc/resolv.conf
              echo "=== DNS test (curl verbose) ==="
              curl -v --max-time 15 -o /dev/null -s -w "code=%{http_code}\n" https://github.com 2>&1 | tail -15

              echo "=== try apt update ==="
              apt update -y 2>&1 | tail -15

              echo "=== try apt install ==="
              apt install -y rust git 2>&1 | tail -10

              echo "=== rustc check ==="
              rustc --version || echo "FAIL: no rustc"

              echo "=== cargo test ==="
              cd /data/data/com.termux/files/home/src
              cargo test --workspace --quiet -- \
                --skip byte_identical \
                --skip _ndk_ \
                --skip _bytecode_ \
                --skip pattern_b_assemble \
                --skip v13_regalloc_pipeline_wiring \
                --skip proc_maps_test \
                2>&1 | tee /data/data/com.termux/files/home/out/test.log
              exit ${PIPESTATUS[0]}
            ' 2>&1 | tee /tmp/test-outer.log
          rc=${PIPESTATUS[0]}

          # Scrub paths in the inner log
          sed -i "s|/data/data/com.termux/[^[:space:]]*|<WORK>|g" /tmp/bionic-out/test.log 2>/dev/null || true

          if [ $rc -ne 0 ] && [ -f /tmp/bionic-out/test.log ]; then
            grep -E '^test .* FAILED' /tmp/bionic-out/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/bionic-out/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-bionic-${{ inputs.commit_sha }}
          path: |
            /tmp/test-outer.log
            /tmp/bionic-out/test.log
          retention-days: 7
          if-no-files-found: warn

  notify_failure:
    needs: [private_glibc, private_bionic]
    if: failure()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Send Telegram alert
        env:
          GLIBC: ${{ needs.private_glibc.result }}
          BIONIC: ${{ needs.private_bionic.result }}
          FAILS_GLIBC: ${{ needs.private_glibc.outputs.failures }}
          FAILS_BIONIC: ${{ needs.private_bionic.outputs.failures }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use printf with %s args (NOT heredoc) so backticks/$() in failure
          # output don't trigger command substitution. Inputs are read from env,
          # not interpolated into script source — prevents injection.
          MSG=$(printf 'CI failed\nbranch: %s\nsha:    %s\nglibc:  %s\nbionic: %s\n\n--- glibc failures ---\n%s\n\n--- bionic failures ---\n%s\n\nRun: %s\n' \
            "$BRANCH" "$SHA" "$GLIBC" "$BIONIC" "$FAILS_GLIBC" "$FAILS_BIONIC" "$RUN_URL")

          if [ ${#MSG} -gt 4000 ]; then
            MSG="${MSG:0:1800}"$'\n[... truncated ...]\n'"${MSG: -1800}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
