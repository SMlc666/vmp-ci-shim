name: AVD Smoke

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Private android_vmp ref to annotate in the report'
        required: false
        type: string
        default: 'main'
  schedule:
    # Nightly auxiliary signal. UTC 19:23 = Asia/Shanghai 03:23.
    - cron: '23 19 * * *'

permissions:
  contents: read

jobs:
  avd_smoke:
    name: AVD Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Manual runs are exploratory and must not become a hard gate. Nightly
    # schedule runs are allowed to fail this standalone workflow.
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      TARGET_REF: ${{ github.event.inputs.target_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone private source for provenance
        run: |
          set -euo pipefail
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src
          git fetch origin "$TARGET_REF" --depth 50 || true
          git checkout "$TARGET_REF"
          echo "PRIVATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - name: Probe private repo Android artifacts
        run: python3 .github/scripts/avd-project-probe.py

      - name: Restore AVD cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api35-googleapis-x86_64-pixel6-v1

      - name: Generate AVD snapshot for cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-metrics
            -gpu swiftshader_indirect
          script: echo "Generated AVD snapshot for caching."

      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api35-googleapis-x86_64-pixel6-v1

      - name: Boot cached AVD and collect smoke report
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-metrics
            -gpu swiftshader_indirect
            -no-snapshot-save
          script: sh .github/scripts/avd-smoke-report.sh

      - name: Upload AVD smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avd-smoke-${{ github.run_id }}
          path: |
            avd-smoke-report.json
            avd-device-tests.json
            avd-project-probe.json
            avd-native-bridge-smoke.json
            avd-logcat.txt
            native-bridge-smoke.apk
          retention-days: 14
          if-no-files-found: warn
