name: CI

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to test'
        required: true
        type: string
      branch:
        description: 'Branch name (for context)'
        required: false
        type: string
        default: 'main'

concurrency:
  group: ${{ github.event.inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  public_demo:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path examples/hello-arm64/Cargo.toml --quiet

  private_glibc:
    runs-on: ubuntu-24.04-arm
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - id: test
        name: Run cargo test
        working-directory: src
        run: |
          cargo test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          sed -i "s|/home/runner/work/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-glibc-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7

  # Bionic job: native execution of termux's bionic userland on the ARM64
  # Linux host. No Docker, no chroot — just extract termux bootstrap to the
  # path baked into its binaries (/data/data/com.termux/files) and invoke
  # them directly. Bionic linker + libs ship in the tarball; Linux kernel
  # doesn't care which libc a process uses.
  private_bionic:
    runs-on: ubuntu-24.04-arm
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    env:
      TERMUX_PREFIX: /data/data/com.termux/files/usr
      TERMUX_HOME: /data/data/com.termux/files/home
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - name: Bootstrap termux bionic userland
        run: |
          # Termux binaries hard-code /data/data/com.termux/files/ — must use this path
          sudo mkdir -p "$TERMUX_PREFIX" "$TERMUX_HOME"
          sudo chown -R "$USER:$USER" /data/data/com.termux

          # Latest bootstrap from termux-packages releases
          BOOTSTRAP_URL=$(curl -fsSL https://api.github.com/repos/termux/termux-packages/releases/latest \
            | python3 -c "import json,sys; r=json.load(sys.stdin); [print(a['browser_download_url']) for a in r['assets'] if 'bootstrap-aarch64' in a['name']]" \
            | head -1)
          echo "Bootstrap URL: $BOOTSTRAP_URL"

          cd /tmp
          curl -fsSL "$BOOTSTRAP_URL" -o bootstrap.zip
          ls -lh bootstrap.zip

          # Extract directly to $PREFIX
          unzip -q bootstrap.zip -d "$TERMUX_PREFIX"

          # Create symlinks listed in SYMLINKS.txt (termux uses ← as separator)
          if [ -f "$TERMUX_PREFIX/SYMLINKS.txt" ]; then
            cd "$TERMUX_PREFIX"
            while IFS='←' read -r src dst; do
              [ -n "$src" ] && [ -n "$dst" ] && ln -sf "$src" "$dst"
            done < SYMLINKS.txt
            rm SYMLINKS.txt
            cd -
          fi

          echo "=== what's in lib (linker candidates)? ==="
          ls "$TERMUX_PREFIX/lib/" | grep -iE "(linker|ld-|loader)" | head -10
          echo "=== PT_INTERP of apt binary ==="
          readelf -p .interp "$TERMUX_PREFIX/bin/apt" 2>&1 | head -5
          echo "=== dynamic deps of apt ==="
          readelf -d "$TERMUX_PREFIX/bin/apt" 2>&1 | grep NEEDED | head -10

          # Create /system symlinks based on what we find
          sudo mkdir -p /system/bin
          sudo ln -sfn "$TERMUX_PREFIX/lib" /system/lib64

          # Find the actual linker file
          for cand in ld-android.so linker64 linker ld-linux-aarch64.so.1; do
            if [ -f "$TERMUX_PREFIX/lib/$cand" ]; then
              sudo ln -sfn "$TERMUX_PREFIX/lib/$cand" /system/bin/linker64
              echo "Using linker: $cand"
              break
            fi
          done

          echo "=== verify symlinks ==="
          ls -la /system/bin/linker64 /system/lib64
          echo "=== readlink target check ==="
          readlink -f /system/bin/linker64
          [ -e /system/bin/linker64 ] && echo "linker64 target EXISTS" || echo "linker64 target MISSING"

          echo "=== try apt --version ==="
          "$TERMUX_PREFIX/bin/apt" --version 2>&1 || echo "(apt failed)"
          echo "=== try invoking linker directly ==="
          /system/bin/linker64 "$TERMUX_PREFIX/bin/apt" --version 2>&1 | head -5 || echo "(direct linker invocation also failed)"

      - name: Install rust + git via termux apt
        run: |
          export PREFIX="$TERMUX_PREFIX"
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"

          # bionic resolver should use host's /etc/resolv.conf
          echo "=== DNS test ==="
          "$TERMUX_PREFIX/bin/curl" -sI --max-time 10 https://github.com | head -2 || { echo "FAIL: curl/DNS"; exit 1; }

          echo "=== apt update ==="
          "$TERMUX_PREFIX/bin/apt" update -y 2>&1 | tail -10

          echo "=== apt install rust git ==="
          "$TERMUX_PREFIX/bin/apt" install -y rust git 2>&1 | tail -10

          echo "=== rustc version ==="
          "$TERMUX_PREFIX/bin/rustc" --version

      - id: test
        name: Run cargo test against bionic
        run: |
          export PREFIX="$TERMUX_PREFIX"
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"

          # Move source into termux home so build artifacts are in bionic-land
          cp -r src "$TERMUX_HOME/src"
          cd "$TERMUX_HOME/src"

          "$TERMUX_PREFIX/bin/cargo" test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}

          sed -i "s|/data/data/com.termux/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-bionic-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7
          if-no-files-found: warn

  notify_failure:
    needs: [private_glibc, private_bionic]
    if: failure()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Send Telegram alert
        env:
          GLIBC: ${{ needs.private_glibc.result }}
          BIONIC: ${{ needs.private_bionic.result }}
          FAILS_GLIBC: ${{ needs.private_glibc.outputs.failures }}
          FAILS_BIONIC: ${{ needs.private_bionic.outputs.failures }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use printf with %s args (NOT heredoc) so backticks/$() in failure
          # output don't trigger command substitution. Inputs are read from env,
          # not interpolated into script source — prevents injection.
          MSG=$(printf 'CI failed\nbranch: %s\nsha:    %s\nglibc:  %s\nbionic: %s\n\n--- glibc failures ---\n%s\n\n--- bionic failures ---\n%s\n\nRun: %s\n' \
            "$BRANCH" "$SHA" "$GLIBC" "$BIONIC" "$FAILS_GLIBC" "$FAILS_BIONIC" "$RUN_URL")

          if [ ${#MSG} -gt 4000 ]; then
            MSG="${MSG:0:1800}"$'\n[... truncated ...]\n'"${MSG: -1800}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
