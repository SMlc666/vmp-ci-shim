name: CI

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to test'
        required: true
        type: string
      branch:
        description: 'Branch name (for context)'
        required: false
        type: string
        default: 'main'

concurrency:
  group: ${{ github.event.inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  public_demo:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path examples/hello-arm64/Cargo.toml --quiet

  private_glibc:
    runs-on: ubuntu-24.04-arm
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - id: test
        name: Run cargo test
        working-directory: src
        run: |
          cargo test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          sed -i "s|/home/runner/work/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-glibc-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7

  # Bionic job: native execution of termux's bionic userland on the ARM64
  # Linux host. No Docker, no chroot — extract a pre-baked termux+rust
  # image to /data/data/com.termux + /system and invoke binaries directly.
  # Linux kernel doesn't care which libc a process uses; only the linker
  # path needs to exist (/system/bin/linker64 from the image).
  private_bionic:
    runs-on: ubuntu-24.04-arm
    # Bionic runs are "indicator" status only — surface failures in GHA UI but
    # don't block CI green. Real CI gate is private_glibc.
    continue-on-error: true
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    env:
      TERMUX_PREFIX: /data/data/com.termux/files/usr
      TERMUX_HOME: /data/data/com.termux/files/home
      # Pre-baked image with rust + git pre-installed. Bump the tag when
      # the Dockerfile changes (and rebuild via build-bionic-image.yml).
      BIONIC_IMAGE: ghcr.io/smlc666/termux-rust:v2
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - name: Install + start HTTP proxy (tinyproxy)
        # tinyproxy bridges bionic's broken DNS by accepting CONNECT on 127.0.0.1
        # and resolving upstream hostnames via host's glibc. Must run BEFORE
        # any termux apt/cargo network activity, regardless of cache hit/miss.
        run: |
          sudo apt-get install -y tinyproxy >/dev/null
          sudo bash -c 'printf "%s\n" "User tinyproxy" "Group tinyproxy" "Port 3128" "Listen 127.0.0.1" "Timeout 600" "LogLevel Warning" "PidFile \"/run/tinyproxy/tinyproxy.pid\"" "MaxClients 100" "Allow 127.0.0.1" "ConnectPort 443" "ConnectPort 80" "DisableViaHeader Yes" > /etc/tinyproxy/tinyproxy.conf'
          sudo systemctl restart tinyproxy
          sudo systemctl is-active tinyproxy
          curl -sI --max-time 10 -x http://127.0.0.1:3128 https://github.com | head -2

      - name: Restore bionic userland cache (extracted from pre-baked image)
        id: bionic-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/bionic-userland.tar
          # Cache key is tied to the image tag only — ci.yml edits no longer
          # invalidate. Bump BIONIC_IMAGE tag → bump cache key string here.
          key: bionic-userland-v5-image-v2

      - name: Log in to ghcr.io
        if: steps.bionic-cache.outputs.cache-hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract bionic from pre-baked image (cache miss)
        if: steps.bionic-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "=== docker pull $BIONIC_IMAGE ==="
          docker pull "$BIONIC_IMAGE"

          echo "=== docker create + cp ==="
          docker create --name termux-extract "$BIONIC_IMAGE" sleep infinity
          sudo mkdir -p /data/data/com.termux
          sudo docker cp termux-extract:/data/data/com.termux/files /data/data/com.termux/files
          sudo docker cp termux-extract:/system /system
          docker rm termux-extract

          sudo chown -R "$USER:$USER" /data/data/com.termux

          echo "=== sanity: bionic linker present ==="
          ls -la /system/bin/linker64 /system/lib64
          [ -e /system/bin/linker64 ] && echo "linker target EXISTS" || { echo "FAIL: linker missing"; exit 1; }

          echo "=== sanity: rustc baked in ==="
          "$TERMUX_PREFIX/bin/rustc" --version
          "$TERMUX_PREFIX/bin/git" --version

          echo "=== snapshot tarball ==="
          sudo tar -cf /tmp/bionic-userland.tar /data/data/com.termux /system 2>/dev/null
          ls -lh /tmp/bionic-userland.tar

      - name: Save bionic userland cache
        # Explicit save BEFORE cargo test runs — actions/cache@v4's bundled
        # post-step skips save when a later step fails, and cargo test
        # routinely fails in bionic (continue-on-error). Saving here keeps
        # the warm-cache path independent of test outcome.
        if: steps.bionic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/bionic-userland.tar
          key: bionic-userland-v5-image-v2

      - name: Restore bionic userland (cache hit)
        if: steps.bionic-cache.outputs.cache-hit == 'true'
        run: |
          set -e
          echo "=== restoring cached bionic tarball ==="
          ls -lh /tmp/bionic-userland.tar
          sudo tar -xf /tmp/bionic-userland.tar -C /
          sudo chown -R "$USER:$USER" /data/data/com.termux

          echo "=== sanity check ==="
          "$TERMUX_PREFIX/bin/rustc" --version || { echo "FAIL: cached rust broken"; exit 1; }

      - name: Restore cargo cache (bionic)
        # Caches ~/.cargo/registry, ~/.cargo/git, and CARGO_TARGET_DIR
        # ($HOME/target, redirected away from $HOME/src/target so cp -r doesn't
        # collide). Key tied to Cargo.lock hash; restore-keys gives partial
        # match for incremental compile when Cargo.lock changes.
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /data/data/com.termux/files/home/.cargo/registry
            /data/data/com.termux/files/home/.cargo/git
            /data/data/com.termux/files/home/target
          key: cargo-bionic-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: |
            cargo-bionic-

      - id: test
        name: Run cargo test against bionic
        run: |
          export PREFIX="$TERMUX_PREFIX"
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"
          # Cargo also needs to reach crates.io for dep download — same bionic-DNS
          # blocker, same proxy fix.
          export HTTPS_PROXY=http://127.0.0.1:3128
          export HTTP_PROXY=http://127.0.0.1:3128
          # Override project's .cargo/config.toml NDK paths (which only exist on
          # the dev box) with termux's own clang. CARGO_TARGET_*_LINKER env var
          # takes precedence over workspace cargo config.
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TERMUX_PREFIX/bin/clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TERMUX_PREFIX/bin/llvm-ar"
          # Redirect target/ outside src/ — keeps cp -r non-colliding with
          # cache-restored target, and lets CARGO_TARGET_DIR alone control
          # cache contents.
          export CARGO_TARGET_DIR="$TERMUX_HOME/target"

          cp -r src "$TERMUX_HOME/src"
          # vmp-lifter's e2e tests resolve vmp-runner via env!("CARGO_MANIFEST_DIR")/../target/<profile>/vmp-runner
          # — a compile-time-baked relative path. With CARGO_TARGET_DIR pointing
          # outside src/, that lookup misses unless src/target is symlinked to
          # the real target dir. mkdir+ln-sfn covers both first run (target/
          # doesn't exist yet) and cache-restored target.
          mkdir -p "$TERMUX_HOME/target"
          ln -sfn "$TERMUX_HOME/target" "$TERMUX_HOME/src/target"
          cd "$TERMUX_HOME/src"

          # Cat 2B phase-bisect (2026-05-25): VMP_PHASE_SHA=1 prints SHA-256
          # of in-memory state after each pipeline phase. Diff against
          # glibc-host SHAs to locate which phase introduces host
          # non-determinism. Remove this env var once Cat 2B is resolved.
          export VMP_PHASE_SHA=1
          "$TERMUX_PREFIX/bin/cargo" test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}

          sed -i "s|/data/data/com.termux/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - name: Real-lib suite e2e (libsqlite, bionic)
        # The main --workspace run bails fast on the lib binary's known Cat 2B
        # failures, so the integration binary never runs there. Run it
        # standalone (already compiled above). if: always() because the main
        # test step exits non-zero; continue-on-error keeps it an indicator
        # like the rest of the bionic job.
        if: always()
        continue-on-error: true
        run: |
          export PREFIX="$TERMUX_PREFIX"
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"
          export HTTPS_PROXY=http://127.0.0.1:3128
          export HTTP_PROXY=http://127.0.0.1:3128
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TERMUX_PREFIX/bin/clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TERMUX_PREFIX/bin/llvm-ar"
          export CARGO_TARGET_DIR="$TERMUX_HOME/target"
          # Real-lib suite e2e (libsqlite): SQLite amalgamation baked into the
          # image under $TERMUX_PREFIX (Docker ENV isn't inherited by the
          # extract-and-run model, so SQLITE_SRC_DIR is set here).
          export VMP_REALIB_E2E=1
          export SQLITE_SRC_DIR="$TERMUX_PREFIX/realib-sqlite/sqlite-amalgamation-3450300"
          cd "$TERMUX_HOME/src"
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test realib_sqlite_e2e -- --nocapture

      - name: realib suite spike Phase A [temp]
        if: always()
        continue-on-error: true
        run: |
          export PREFIX="$TERMUX_PREFIX"; export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"
          export SQLITE_SRC_DIR="$TERMUX_PREFIX/realib-sqlite/sqlite-amalgamation-3450300"
          FULLSRC="$TERMUX_PREFIX/realib-sqlite/sqlite-src-3450300"
          cd "$TERMUX_HOME/src"
          SO="$PWD/tests/realib_fixtures/sqlite/build/libsqlite3.so"; SODIR="$(dirname "$SO")"
          [ -f "$SO" ] || bash tests/realib_fixtures/sqlite/build.sh
          echo "=== A1: can tester.tcl run select1.test under the mechanism-B ext? ==="
          clang -shared -fPIC -DUSE_TCL_STUBS=1 -I"$PREFIX/include" -I"$SQLITE_SRC_DIR" -I"$FULLSRC" \
            "$FULLSRC/src/tclsqlite.c" -o /tmp/libtclsqlite3.so \
            -L"$SODIR" -lsqlite3 "$PREFIX/lib/libtclstub8.6.a" -ldl 2>&1 | tail -5 || echo "ext-build-fail"
          printf '%s\n' 'load /tmp/libtclsqlite3.so Sqlite3' 'set argv0 [file join [pwd] select1.test]' 'set argv {}' 'source select1.test' > /tmp/run_one.tcl
          ( cd "$FULLSRC/test" && LD_LIBRARY_PATH="$SODIR:$PREFIX/lib" "$PREFIX/bin/tclsh" /tmp/run_one.tcl ) 2>&1 | head -45
          echo "A1-DONE"
          echo "=== A2: build testfixture (test1.c) linking EXTERNAL .so, no sqlite3.c ==="
          cd "$FULLSRC"
          clang -DSQLITE_TEST=1 -DSQLITE_CORE -DUSE_TCL_STUBS=1 -I. -I"$SQLITE_SRC_DIR" -I"$PREFIX/include" \
            src/test1.c src/tclsqlite.c -o /tmp/testfixture \
            -L"$SODIR" -lsqlite3 "$PREFIX/lib/libtclstub8.6.a" -lm -ldl 2>&1 | grep -iE "fatal|undefined|sqliteInt|file not found|error:" | head -30
          echo "A2-BUILD-EXIT=${PIPESTATUS[0]}; tf=$(ls -l /tmp/testfixture 2>&1 | head -1)"
          echo "=== spike Phase A done ==="

      - name: Save cargo cache (bionic)
        # if: always() — save even when cargo test fails (87 e2e are known
        # noise; we still want the compile artifacts cached). Skip when
        # exact-key cache-hit (no new content to save).
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /data/data/com.termux/files/home/.cargo/registry
            /data/data/com.termux/files/home/.cargo/git
            /data/data/com.termux/files/home/target
          key: cargo-bionic-${{ hashFiles('src/Cargo.lock') }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-bionic-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7
          if-no-files-found: warn

      # Cat 2B diagnostic (2026-05-25): upload the per-test e2e fixture
      # outputs (orig.so + protected.so + packed.so) so we can compare
      # bionic-host lifter output against local glibc-host lifter output
      # offline. Lets us locate the source of `x16 = 0x12` writes and
      # other host-determinism bugs without needing a bionic debugger.
      # Tarball-only to keep artifact file count low; the dir tree has
      # ~150 sub-dirs.
      - name: Package bionic e2e fixture outputs
        if: failure()
        shell: bash
        run: |
          set -e
          E2E_DIR=/data/data/com.termux/files/home/src/vmp-lifter/fixtures/e2e
          if [ -d "$E2E_DIR" ]; then
            cd /data/data/com.termux/files/home/src/vmp-lifter/fixtures
            tar czf /tmp/e2e-fixtures-bionic.tar.gz e2e/
            ls -lh /tmp/e2e-fixtures-bionic.tar.gz
          else
            echo "[diagnostic] e2e fixtures dir not present (no tests reached file-emit stage)" >&2
          fi

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fixtures-bionic-${{ inputs.commit_sha }}
          path: /tmp/e2e-fixtures-bionic.tar.gz
          retention-days: 7
          if-no-files-found: warn

  notify_failure:
    # Fire on glibc OR bionic failure.
    # NOTE: continue-on-error: true at JOB level MASKS needs.<job>.result
    # to "success" (downstream sees the job as satisfied). The step-level
    # outcome survives via the job's exposed `outputs.result` field — that's
    # what we gate on for bionic.
    needs: [private_glibc, private_bionic]
    if: needs.private_glibc.result == 'failure' || needs.private_bionic.outputs.result == 'failure'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Send Telegram alert
        env:
          GLIBC: ${{ needs.private_glibc.result }}
          BIONIC: ${{ needs.private_bionic.result }}
          FAILS_GLIBC: ${{ needs.private_glibc.outputs.failures }}
          FAILS_BIONIC: ${{ needs.private_bionic.outputs.failures }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use printf with %s args (NOT heredoc) so backticks/$() in failure
          # output don't trigger command substitution. Inputs are read from env,
          # not interpolated into script source — prevents injection.
          MSG=$(printf 'CI failed\nbranch: %s\nsha:    %s\nglibc:  %s\nbionic: %s\n\n--- glibc failures ---\n%s\n\n--- bionic failures ---\n%s\n\nRun: %s\n' \
            "$BRANCH" "$SHA" "$GLIBC" "$BIONIC" "$FAILS_GLIBC" "$FAILS_BIONIC" "$RUN_URL")

          if [ ${#MSG} -gt 4000 ]; then
            MSG="${MSG:0:1800}"$'\n[... truncated ...]\n'"${MSG: -1800}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
