name: CI

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to test'
        required: true
        type: string
      branch:
        description: 'Branch name (for context)'
        required: false
        type: string
        default: 'main'

concurrency:
  group: ${{ github.event.inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  public_demo:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path examples/hello-arm64/Cargo.toml --quiet

  private_glibc:
    runs-on: ubuntu-24.04-arm
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - id: test
        name: Run cargo test
        working-directory: src
        run: |
          cargo test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          sed -i "s|/home/runner/work/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-glibc-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7

  private_bionic:
    runs-on: ubuntu-24.04-arm
    container:
      image: termux/termux-docker:aarch64
      options: --user 1000:1000
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    steps:
      - name: Diagnose termux environment
        run: |
          echo "=== whoami / id ==="
          id
          echo "=== PREFIX ==="
          echo "$PREFIX"
          ls -la "$PREFIX/etc/apt/" 2>&1 | head -5
          echo "=== HTTPS reachability ==="
          curl -sI --max-time 10 https://github.com | head -3 || echo "FAIL: HTTPS unreachable"
          curl -sI --max-time 10 https://packages-cf.termux.dev/apt/termux-main/dists/stable/Release | head -3 || echo "FAIL: termux mirror unreachable"
          echo "=== current sources.list ==="
          cat "$PREFIX/etc/apt/sources.list" 2>&1 || echo "(no sources.list)"

      - name: Force termux mirror + install build deps
        run: |
          # Skip pkg's broken auto-select by writing sources.list directly
          echo "deb https://packages-cf.termux.dev/apt/termux-main stable main" > "$PREFIX/etc/apt/sources.list"
          apt update -y 2>&1 | tail -20
          apt install -y rust git openssh 2>&1 | tail -10

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src && git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - id: test
        name: Run cargo test
        working-directory: src
        run: |
          cargo test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          sed -i "s|/data/data/com.termux/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-bionic-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7

  notify_failure:
    needs: [private_glibc, private_bionic]
    if: failure()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Send Telegram alert
        env:
          GLIBC: ${{ needs.private_glibc.result }}
          BIONIC: ${{ needs.private_bionic.result }}
          FAILS_GLIBC: ${{ needs.private_glibc.outputs.failures }}
          FAILS_BIONIC: ${{ needs.private_bionic.outputs.failures }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use printf with %s args (NOT heredoc) so backticks/$() in failure
          # output don't trigger command substitution. Inputs are read from env,
          # not interpolated into script source — prevents injection.
          MSG=$(printf 'CI failed\nbranch: %s\nsha:    %s\nglibc:  %s\nbionic: %s\n\n--- glibc failures ---\n%s\n\n--- bionic failures ---\n%s\n\nRun: %s\n' \
            "$BRANCH" "$SHA" "$GLIBC" "$BIONIC" "$FAILS_GLIBC" "$FAILS_BIONIC" "$RUN_URL")

          if [ ${#MSG} -gt 4000 ]; then
            MSG="${MSG:0:1800}"$'\n[... truncated ...]\n'"${MSG: -1800}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
