name: CI

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to test'
        required: true
        type: string
      branch:
        description: 'Branch name (for context)'
        required: false
        type: string
        default: 'main'
      oracle_litmus:
        description: 'Run the Cat 2B differential-oracle litmus on bionic'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.event.inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  public_demo:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path examples/hello-arm64/Cargo.toml --quiet

  private_glibc:
    runs-on: ubuntu-24.04-arm
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src
          git fetch origin "${{ inputs.commit_sha }}" --depth 50
          git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Restore eh_fixture cache (glibc)
        uses: actions/cache/restore@v4
        with:
          path: src/tests/cpp_fixtures/eh_fixture/build
          key: eh-fixture-glibc-${{ hashFiles('src/tests/cpp_fixtures/eh_fixture/**') }}

      - id: test
        name: Run cargo test
        working-directory: src
        run: |
          cargo test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          sed -i "s|/home/runner/work/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-glibc-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7

      - name: Restore realib fixtures cache (glibc)
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/sqlite-amalgamation-3450300
            /tmp/openssl-1.1.1w
            /tmp/yaml-cpp-0.9.0
            /tmp/protobuf-31.1
          key: realib-extdeps-glibc-v3

      - name: Precompile realib e2e binaries (glibc)
        if: always()
        working-directory: src
        run: |
          CC=gcc cargo test -p vmp-lifter --test realib_sqlite_e2e --no-run
          CC=gcc cargo test -p vmp-lifter --test realib_libcrypto_e2e --no-run
          CC=gcc cargo test -p vmp-lifter --test realib_yamlcpp_e2e --no-run
          CC=gcc cargo test -p vmp-lifter --test realib_protobuflite_e2e --no-run

      - name: Real-lib suite e2e (glibc)
        if: always()
        run: |
          export VMP_REALIB_E2E=1
          SQLITE_SRC_DIR=/tmp/sqlite-amalgamation-3450300
          if [[ ! -f "${SQLITE_SRC_DIR}/sqlite3.c" ]]; then
            curl -L https://sqlite.org/2024/sqlite-amalgamation-3450300.zip -o /tmp/sqlite.zip
            unzip /tmp/sqlite.zip -d /tmp
          fi
          export SQLITE_SRC_DIR
          OPENSSL_DIR=/tmp/openssl-1.1.1w
          if [[ ! -f "${OPENSSL_DIR}/libcrypto.so.1.1" ]]; then
            curl -L https://www.openssl.org/source/openssl-1.1.1w.tar.gz | tar xz -C /tmp
            (cd "${OPENSSL_DIR}" && ./config shared --prefix=/tmp/openssl-install \
              && make -j$(nproc) && make install_sw)
            cp /tmp/openssl-install/lib/libcrypto.so* "${OPENSSL_DIR}/"
          fi
          export OPENSSL_DIR
          YAMLCPP_SRC_DIR=/tmp/yaml-cpp-0.9.0
          if [[ ! -f "${YAMLCPP_SRC_DIR}/include/yaml-cpp/yaml.h" ]]; then
            rm -rf "${YAMLCPP_SRC_DIR}"
            mkdir -p "${YAMLCPP_SRC_DIR}"
            curl -L https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-0.9.0.tar.gz -o /tmp/yamlcpp.tar.gz
            tar xzf /tmp/yamlcpp.tar.gz -C "${YAMLCPP_SRC_DIR}" --strip-components=1
          fi
          export YAMLCPP_SRC_DIR
          PROTOBUF_SRC_DIR=/tmp/protobuf-31.1
          if [[ ! -f "${PROTOBUF_SRC_DIR}/src/google/protobuf/message_lite.h" ]]; then
            rm -rf "${PROTOBUF_SRC_DIR}"
            mkdir -p "${PROTOBUF_SRC_DIR}"
            curl -L https://github.com/protocolbuffers/protobuf/archive/refs/tags/v31.1.tar.gz -o /tmp/protobuf-v31.1.tar.gz
            tar xzf /tmp/protobuf-v31.1.tar.gz -C "${PROTOBUF_SRC_DIR}" --strip-components=1
          fi
          export PROTOBUF_SRC_DIR
          export CC=gcc
          cd src
          cargo test -p vmp-lifter --test realib_sqlite_e2e -- --nocapture 2>&1 | tee -a /tmp/test.log || true
          cargo test -p vmp-lifter --test realib_libcrypto_e2e -- --nocapture 2>&1 | tee -a /tmp/test.log || true
          cargo test -p vmp-lifter --test realib_yamlcpp_e2e -- --nocapture 2>&1 | tee -a /tmp/test.log || true
          cargo test -p vmp-lifter --test realib_protobuflite_e2e -- --nocapture 2>&1 | tee -a /tmp/test.log || true

      - name: Check glibc realib gate
        if: always()
        run: |
          # Explicit per-suite extraction — each suite emits exactly one
          # `[realib_<suite>] surviving_pass_ratio = X.XXX (…)` line per run.
          # Use PCRE \K to return only the number. Default to 0.0 when a
          # suite emitted no ratio line (binary crashed before gate emit),
          # which fails the gate rather than silently greenlighting it.
          sqlite_ratio=$(grep -oP '\[realib_sqlite\] surviving_pass_ratio = \K[0-9]+\.[0-9]+' /tmp/test.log | tail -1)
          libcrypto_ratio=$(grep -oP '\[realib_libcrypto\] surviving_pass_ratio = \K[0-9]+\.[0-9]+' /tmp/test.log | tail -1)
          yamlcpp_ratio=$(grep -oP '\[realib_yamlcpp\] surviving_pass_ratio = \K[0-9]+\.[0-9]+' /tmp/test.log | tail -1)
          protobuflite_ratio=$(grep -oP '\[realib_protobuflite\] surviving_pass_ratio = \K[0-9]+\.[0-9]+' /tmp/test.log | tail -1)
          sqlite_ratio="${sqlite_ratio:-0.0}"
          libcrypto_ratio="${libcrypto_ratio:-0.0}"
          yamlcpp_ratio="${yamlcpp_ratio:-0.0}"
          protobuflite_ratio="${protobuflite_ratio:-0.0}"
          echo "sqlite    surviving_pass_ratio = $sqlite_ratio"
          echo "libcrypto surviving_pass_ratio = $libcrypto_ratio"
          echo "yamlcpp   surviving_pass_ratio = $yamlcpp_ratio"
          echo "protobuf  surviving_pass_ratio = $protobuflite_ratio"
          gate_fail=0
          if awk "BEGIN {exit !($sqlite_ratio >= 1.0)}"; then
            echo "SQLITE GATE PASS"
          else
            echo "SQLITE GATE FAIL: ratio=$sqlite_ratio < 1.0"
            gate_fail=1
          fi
          if awk "BEGIN {exit !($libcrypto_ratio >= 1.0)}"; then
            echo "LIBCRYPTO GATE PASS"
          else
            echo "LIBCRYPTO GATE FAIL: ratio=$libcrypto_ratio < 1.0"
            gate_fail=1
          fi
          if awk "BEGIN {exit !($yamlcpp_ratio >= 1.0)}"; then
            echo "YAMLCPP GATE PASS"
          else
            echo "YAMLCPP GATE FAIL: ratio=$yamlcpp_ratio < 1.0"
            gate_fail=1
          fi
          if awk "BEGIN {exit !($protobuflite_ratio >= 1.0)}"; then
            echo "PROTOBUFLITE GATE PASS"
          else
            echo "PROTOBUFLITE GATE FAIL: ratio=$protobuflite_ratio < 1.0"
            gate_fail=1
          fi
          if [ "$gate_fail" -ne 0 ]; then exit 1; fi

      - name: Save realib fixtures cache (glibc)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/sqlite-amalgamation-3450300
            /tmp/openssl-1.1.1w
            /tmp/yaml-cpp-0.9.0
            /tmp/protobuf-31.1
          key: realib-extdeps-glibc-v3

      - name: Save eh_fixture cache (glibc)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src/tests/cpp_fixtures/eh_fixture/build
          key: eh-fixture-glibc-${{ hashFiles('src/tests/cpp_fixtures/eh_fixture/**') }}

  # Bionic job: native execution of termux's bionic userland on the ARM64
  # Linux host. No Docker, no chroot — extract a pre-baked termux+rust
  # image to /data/data/com.termux + /system and invoke binaries directly.
  # Linux kernel doesn't care which libc a process uses; only the linker
  # path needs to exist (/system/bin/linker64 from the image).
  private_bionic:
    runs-on: ubuntu-24.04-arm
    outputs:
      result: ${{ steps.test.outcome }}
      failures: ${{ steps.test.outputs.failures }}
    env:
      TERMUX_PREFIX: /data/data/com.termux/files/usr
      TERMUX_HOME: /data/data/com.termux/files/home
      # Pre-baked image with rust + git pre-installed. Bump the tag when
      # the Dockerfile changes (and rebuild via build-bionic-image.yml).
      # ALSO bump the bionic-userland cache key string below
      # (`bionic-userland-vN-image-vM`) to match, otherwise stale
      # userland tarball will be served from cache and ignore the new image.
      BIONIC_IMAGE: ghcr.io/smlc666/termux-rust:v5
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone & checkout
        run: |
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src
          git fetch origin "${{ inputs.commit_sha }}" --depth 50
          git checkout "${{ inputs.commit_sha }}"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - name: Install + start HTTP proxy (tinyproxy)
        # tinyproxy bridges bionic's broken DNS by accepting CONNECT on 127.0.0.1
        # and resolving upstream hostnames via host's glibc. Must run BEFORE
        # any termux apt/cargo network activity, regardless of cache hit/miss.
        run: |
          sudo apt-get install -y tinyproxy >/dev/null
          sudo bash -c 'printf "%s\n" "User tinyproxy" "Group tinyproxy" "Port 3128" "Listen 127.0.0.1" "Timeout 600" "LogLevel Warning" "PidFile \"/run/tinyproxy/tinyproxy.pid\"" "MaxClients 100" "Allow 127.0.0.1" "ConnectPort 443" "ConnectPort 80" "DisableViaHeader Yes" > /etc/tinyproxy/tinyproxy.conf'
          sudo systemctl restart tinyproxy
          sudo systemctl is-active tinyproxy
          curl -sI --max-time 10 -x http://127.0.0.1:3128 https://github.com | head -2

      - name: Restore bionic userland cache (extracted from pre-baked image)
        id: bionic-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/bionic-userland.tar
          # Cache key is tied to the image tag only — ci.yml edits no longer
          # invalidate. Bump BIONIC_IMAGE tag → bump cache key string here.
          key: bionic-userland-v7-image-v5

      - name: Log in to ghcr.io
        if: steps.bionic-cache.outputs.cache-hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract bionic from pre-baked image (cache miss)
        if: steps.bionic-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "=== docker pull $BIONIC_IMAGE ==="
          docker pull "$BIONIC_IMAGE"

          echo "=== docker create + cp ==="
          docker create --name termux-extract "$BIONIC_IMAGE" sleep infinity
          sudo mkdir -p /data/data/com.termux
          sudo docker cp termux-extract:/data/data/com.termux/files /data/data/com.termux/files
          sudo docker cp termux-extract:/system /system
          docker rm termux-extract

          sudo chown -R "$USER:$USER" /data/data/com.termux

          echo "=== sanity: bionic linker present ==="
          ls -la /system/bin/linker64 /system/lib64
          [ -e /system/bin/linker64 ] && echo "linker target EXISTS" || { echo "FAIL: linker missing"; exit 1; }

          echo "=== sanity: rustc baked in ==="
          "$TERMUX_PREFIX/bin/rustc" --version
          "$TERMUX_PREFIX/bin/git" --version

          echo "=== snapshot tarball ==="
          sudo tar -cf /tmp/bionic-userland.tar /data/data/com.termux /system 2>/dev/null
          ls -lh /tmp/bionic-userland.tar

      - name: Save bionic userland cache
        # Explicit save BEFORE cargo test runs — actions/cache@v4's bundled
        # post-step skips save when a later step fails, and cargo test
        # routinely fails in bionic (continue-on-error). Saving here keeps
        # the warm-cache path independent of test outcome.
        if: steps.bionic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/bionic-userland.tar
          key: bionic-userland-v7-image-v5

      - name: Restore bionic userland (cache hit)
        if: steps.bionic-cache.outputs.cache-hit == 'true'
        run: |
          set -e
          echo "=== restoring cached bionic tarball ==="
          ls -lh /tmp/bionic-userland.tar
          sudo tar -xf /tmp/bionic-userland.tar -C /
          sudo chown -R "$USER:$USER" /data/data/com.termux

          echo "=== sanity check ==="
          "$TERMUX_PREFIX/bin/rustc" --version || { echo "FAIL: cached rust broken"; exit 1; }

      - name: Restore cargo cache (bionic)
        # Caches ~/.cargo/registry, ~/.cargo/git, and CARGO_TARGET_DIR
        # ($HOME/target, redirected away from $HOME/src/target so cp -r doesn't
        # collide). Key tied to Cargo.lock hash; restore-keys gives partial
        # match for incremental compile when Cargo.lock changes.
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /data/data/com.termux/files/home/.cargo/registry
            /data/data/com.termux/files/home/.cargo/git
            /data/data/com.termux/files/home/target
          key: cargo-bionic-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: |
            cargo-bionic-

      - name: Restore eh_fixture cache (bionic)
        uses: actions/cache/restore@v4
        with:
          path: src/tests/cpp_fixtures/eh_fixture/build
          key: eh-fixture-bionic-${{ hashFiles('src/tests/cpp_fixtures/eh_fixture/**') }}

      - name: Restore realib fixtures cache (bionic)
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/sqlite-amalgamation-3450300
            /tmp/openssl-1.1.1w
            /tmp/yaml-cpp-0.9.0
            /tmp/protobuf-31.1
          key: realib-extdeps-bionic-v2

      - id: test
        name: Run cargo test against bionic
        run: |
          export PREFIX="$TERMUX_PREFIX"
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"
          # Cargo also needs to reach crates.io for dep download — same bionic-DNS
          # blocker, same proxy fix.
          export HTTPS_PROXY=http://127.0.0.1:3128
          export HTTP_PROXY=http://127.0.0.1:3128
          # Override project's .cargo/config.toml NDK paths (which only exist on
          # the dev box) with termux's own clang. CARGO_TARGET_*_LINKER env var
          # takes precedence over workspace cargo config.
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TERMUX_PREFIX/bin/clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TERMUX_PREFIX/bin/llvm-ar"
          # Redirect target/ outside src/ — keeps cp -r non-colliding with
          # cache-restored target, and lets CARGO_TARGET_DIR alone control
          # cache contents.
          export CARGO_TARGET_DIR="$TERMUX_HOME/target"

          # vmp-lifter's e2e tests resolve vmp-runner via env!("CARGO_MANIFEST_DIR")/../target/<profile>/vmp-runner
          # — a compile-time-baked relative path. With CARGO_TARGET_DIR pointing
          # outside src/, that lookup misses unless src/target is symlinked to
          # the real target dir. mkdir+ln-sfn covers both first run (target/
          # doesn't exist yet) and cache-restored target.
          mkdir -p "$TERMUX_HOME/target"
          ln -sfn "$TERMUX_HOME/target" src/target
          cd src

          # Cat 2B phase-bisect (2026-05-25): VMP_PHASE_SHA=1 prints SHA-256
          # of in-memory state after each pipeline phase. Diff against
          # glibc-host SHAs to locate which phase introduces host
          # non-determinism. Remove this env var once Cat 2B is resolved.
          export VMP_PHASE_SHA=1
          "$TERMUX_PREFIX/bin/cargo" test --workspace --quiet -- \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}

          sed -i "s|/data/data/com.termux/[^[:space:]]*|<WORK>|g" /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E '^test .* FAILED' /tmp/test.log | head -20 > /tmp/failures.txt
            tail -50 /tmp/test.log >> /tmp/failures.txt
            {
              echo "failures<<EOF_FAIL"
              cat /tmp/failures.txt
              echo "EOF_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - name: Precompile realib e2e binaries (bionic)
        if: always()
        run: |
          export PREFIX="$TERMUX_PREFIX"
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export HTTPS_PROXY=http://127.0.0.1:3128
          export HTTP_PROXY=http://127.0.0.1:3128
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TERMUX_PREFIX/bin/clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TERMUX_PREFIX/bin/llvm-ar"
          export CARGO_TARGET_DIR="$TERMUX_HOME/target"
          export CC="$TERMUX_PREFIX/bin/clang"
          cd src
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test realib_sqlite_e2e --no-run
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test realib_libcrypto_e2e --no-run
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test realib_yamlcpp_e2e --no-run
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test realib_protobuflite_e2e --no-run

      - name: Real-lib suite e2e (sqlite + libcrypto + yamlcpp + protobuflite, bionic)
        # The main --workspace run bails fast on the lib binary's known Cat 2B
        # failures, so the integration binary never runs there. Run it
        # standalone (precompiled above). if: always() because the main
        # test step exits non-zero.
        if: always()
        run: |
          export PREFIX="$TERMUX_PREFIX"
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"
          export HTTPS_PROXY=http://127.0.0.1:3128
          export HTTP_PROXY=http://127.0.0.1:3128
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TERMUX_PREFIX/bin/clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TERMUX_PREFIX/bin/llvm-ar"
          export CARGO_TARGET_DIR="$TERMUX_HOME/target"
          export VMP_REALIB_E2E=1

          SQLITE_SRC_DIR=/tmp/sqlite-amalgamation-3450300
          if [[ ! -f "${SQLITE_SRC_DIR}/sqlite3.c" ]]; then
            # Cache miss — fall back to the image-baked copy if available,
            # otherwise download fresh (sqlite is pure C source, no
            # platform-specific build needed).
            BAKED="$TERMUX_PREFIX/realib-sqlite/sqlite-amalgamation-3450300"
            if [[ -f "${BAKED}/sqlite3.c" ]]; then
              cp -a "$BAKED" /tmp/sqlite-amalgamation-3450300
            else
              curl -L https://sqlite.org/2024/sqlite-amalgamation-3450300.zip -o /tmp/sqlite.zip
              unzip /tmp/sqlite.zip -d /tmp
            fi
          fi
          export SQLITE_SRC_DIR

          OPENSSL_DIR=/tmp/openssl-1.1.1w
          if [[ ! -f "${OPENSSL_DIR}/libcrypto.so.1.1" ]]; then
            # Cache miss — use the image-baked bionic-compiled copy.
            # Do NOT run ./config + make here: openssl's config script has
            # bionic-specific quirks; the image ships a pre-verified build.
            # NOTE: Dockerfile lays it out at realib-openssl/openssl-1.1.1w/
            # (subdirectory), not directly under realib-openssl/.
            BAKED="$TERMUX_PREFIX/realib-openssl/openssl-1.1.1w"
            if [[ -f "${BAKED}/libcrypto.so.1.1" ]]; then
              cp -a "$BAKED" /tmp/openssl-1.1.1w
            else
              echo "FATAL: no cached or baked openssl for bionic" >&2
              exit 1
            fi
          fi
          export OPENSSL_DIR

          YAMLCPP_SRC_DIR=/tmp/yaml-cpp-0.9.0
          if [[ ! -f "${YAMLCPP_SRC_DIR}/include/yaml-cpp/yaml.h" ]]; then
            rm -rf "${YAMLCPP_SRC_DIR}"
            mkdir -p "${YAMLCPP_SRC_DIR}"
            curl -L https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-0.9.0.tar.gz -o /tmp/yamlcpp.tar.gz
            tar xzf /tmp/yamlcpp.tar.gz -C "${YAMLCPP_SRC_DIR}" --strip-components=1
          fi
          export YAMLCPP_SRC_DIR

          PROTOBUF_SRC_DIR=/tmp/protobuf-31.1
          if [[ ! -f "${PROTOBUF_SRC_DIR}/src/google/protobuf/message_lite.h" ]]; then
            rm -rf "${PROTOBUF_SRC_DIR}"
            mkdir -p "${PROTOBUF_SRC_DIR}"
            curl -L https://github.com/protocolbuffers/protobuf/archive/refs/tags/v31.1.tar.gz -o /tmp/protobuf-v31.1.tar.gz
            tar xzf /tmp/protobuf-v31.1.tar.gz -C "${PROTOBUF_SRC_DIR}" --strip-components=1
          fi
          export PROTOBUF_SRC_DIR

          export CC="$TERMUX_PREFIX/bin/clang"
          cd src
          # `|| true`: each adapter is an independent indicator; a failing one
          # (e.g. surfaced Cat 2B) must not abort the step before the next runs.
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test realib_sqlite_e2e -- --nocapture 2>&1 | tee -a /tmp/test.log || true
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test realib_libcrypto_e2e -- --nocapture 2>&1 | tee -a /tmp/test.log || true
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test realib_yamlcpp_e2e -- --nocapture 2>&1 | tee -a /tmp/test.log || true
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test realib_protobuflite_e2e -- --nocapture 2>&1 | tee -a /tmp/test.log || true

      - name: Check bionic realib gate
        if: always()
        run: |
          # Explicit per-suite extraction — each suite emits exactly one
          # `[realib_<suite>] surviving_pass_ratio = X.XXX (…)` line per run.
          # Use PCRE \K to return only the number. Default to 0.0 when a
          # suite emitted no ratio line (binary crashed before gate emit),
          # which fails the gate rather than silently greenlighting it.
          sqlite_ratio=$(grep -oP '\[realib_sqlite\] surviving_pass_ratio = \K[0-9]+\.[0-9]+' /tmp/test.log | tail -1)
          libcrypto_ratio=$(grep -oP '\[realib_libcrypto\] surviving_pass_ratio = \K[0-9]+\.[0-9]+' /tmp/test.log | tail -1)
          yamlcpp_ratio=$(grep -oP '\[realib_yamlcpp\] surviving_pass_ratio = \K[0-9]+\.[0-9]+' /tmp/test.log | tail -1)
          protobuflite_ratio=$(grep -oP '\[realib_protobuflite\] surviving_pass_ratio = \K[0-9]+\.[0-9]+' /tmp/test.log | tail -1)
          sqlite_ratio="${sqlite_ratio:-0.0}"
          libcrypto_ratio="${libcrypto_ratio:-0.0}"
          yamlcpp_ratio="${yamlcpp_ratio:-0.0}"
          protobuflite_ratio="${protobuflite_ratio:-0.0}"
          echo "sqlite    surviving_pass_ratio = $sqlite_ratio"
          echo "libcrypto surviving_pass_ratio = $libcrypto_ratio"
          echo "yamlcpp   surviving_pass_ratio = $yamlcpp_ratio"
          echo "protobuf  surviving_pass_ratio = $protobuflite_ratio"
          gate_fail=0
          if awk "BEGIN {exit !($sqlite_ratio >= 1.0)}"; then
            echo "SQLITE GATE PASS"
          else
            echo "SQLITE GATE FAIL: ratio=$sqlite_ratio < 1.0"
            gate_fail=1
          fi
          if awk "BEGIN {exit !($libcrypto_ratio >= 1.0)}"; then
            echo "LIBCRYPTO GATE PASS"
          else
            echo "LIBCRYPTO GATE FAIL: ratio=$libcrypto_ratio < 1.0"
            gate_fail=1
          fi
          if awk "BEGIN {exit !($yamlcpp_ratio >= 1.0)}"; then
            echo "YAMLCPP GATE PASS"
          else
            echo "YAMLCPP GATE FAIL: ratio=$yamlcpp_ratio < 1.0"
            gate_fail=1
          fi
          if awk "BEGIN {exit !($protobuflite_ratio >= 1.0)}"; then
            echo "PROTOBUFLITE GATE PASS"
          else
            echo "PROTOBUFLITE GATE FAIL: ratio=$protobuflite_ratio < 1.0"
            gate_fail=1
          fi
          if [ "$gate_fail" -ne 0 ]; then exit 1; fi

      - name: Save realib fixtures cache (bionic)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/sqlite-amalgamation-3450300
            /tmp/openssl-1.1.1w
            /tmp/yaml-cpp-0.9.0
            /tmp/protobuf-31.1
          key: realib-extdeps-bionic-v2

      - name: Oracle Cat 2B litmus (bionic)
        # Proof the three-way differential oracle auto-classifies mba_smoke as
        # NATIVE-EXEC (bytecode correct, native VM crashes) on bionic — the
        # diagnosis that took multiple sessions by hand, now one automated run.
        # Gated on the oracle_litmus dispatch input so normal/hook-triggered
        # runs skip it (the test self-skips when VMP_ORACLE_LITMUS != 1). NOT
        # continue-on-error: this step passing IS the proof the oracle works.
        if: ${{ always() && inputs.oracle_litmus }}
        run: |
          export PREFIX="$TERMUX_PREFIX"
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"
          export HTTPS_PROXY=http://127.0.0.1:3128
          export HTTP_PROXY=http://127.0.0.1:3128
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TERMUX_PREFIX/bin/clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TERMUX_PREFIX/bin/llvm-ar"
          export CARGO_TARGET_DIR="$TERMUX_HOME/target"
          # Gate ON + compile mba_smoke.c with bionic clang (matches the
          # confirmed local repro recipe).
          export VMP_ORACLE_LITMUS=1
          export CC="$TERMUX_PREFIX/bin/clang"
          cd src
          "$TERMUX_PREFIX/bin/cargo" test -p vmp-lifter --test oracle_litmus -- --nocapture

      - name: Save cargo cache (bionic)
        # if: always() — save even when cargo test fails (87 e2e are known
        # noise; we still want the compile artifacts cached). Skip when
        # exact-key cache-hit (no new content to save).
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /data/data/com.termux/files/home/.cargo/registry
            /data/data/com.termux/files/home/.cargo/git
            /data/data/com.termux/files/home/target
          key: cargo-bionic-${{ hashFiles('src/Cargo.lock') }}

      - name: Save eh_fixture cache (bionic)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src/tests/cpp_fixtures/eh_fixture/build
          key: eh-fixture-bionic-${{ hashFiles('src/tests/cpp_fixtures/eh_fixture/**') }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-bionic-${{ inputs.commit_sha }}
          path: /tmp/test.log
          retention-days: 7
          if-no-files-found: warn

      # Cat 2B diagnostic (2026-05-25): upload the per-test e2e fixture
      # outputs (orig.so + protected.so + packed.so) so we can compare
      # bionic-host lifter output against local glibc-host lifter output
      # offline. Lets us locate the source of `x16 = 0x12` writes and
      # other host-determinism bugs without needing a bionic debugger.
      # Tarball-only to keep artifact file count low; the dir tree has
      # ~150 sub-dirs.
      - name: Package bionic e2e fixture outputs
        if: failure()
        shell: bash
        run: |
          set -e
          E2E_DIR=/data/data/com.termux/files/home/src/vmp-lifter/fixtures/e2e
          if [ -d "$E2E_DIR" ]; then
            cd /data/data/com.termux/files/home/src/vmp-lifter/fixtures
            tar czf /tmp/e2e-fixtures-bionic.tar.gz e2e/
            ls -lh /tmp/e2e-fixtures-bionic.tar.gz
          else
            echo "[diagnostic] e2e fixtures dir not present (no tests reached file-emit stage)" >&2
          fi

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fixtures-bionic-${{ inputs.commit_sha }}
          path: /tmp/e2e-fixtures-bionic.tar.gz
          retention-days: 7
          if-no-files-found: warn

  notify_failure:
    # Fire on glibc OR bionic failure.
    # NOTE: continue-on-error: true at JOB level MASKS needs.<job>.result
    # to "success" (downstream sees the job as satisfied). The step-level
    # outcome survives via the job's exposed `outputs.result` field — that's
    # what we gate on for bionic.
    needs: [private_glibc, private_bionic]
    if: needs.private_glibc.result == 'failure' || needs.private_bionic.outputs.result == 'failure'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Send Telegram alert
        env:
          GLIBC: ${{ needs.private_glibc.result }}
          BIONIC: ${{ needs.private_bionic.result }}
          FAILS_GLIBC: ${{ needs.private_glibc.outputs.failures }}
          FAILS_BIONIC: ${{ needs.private_bionic.outputs.failures }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use printf with %s args (NOT heredoc) so backticks/$() in failure
          # output don't trigger command substitution. Inputs are read from env,
          # not interpolated into script source — prevents injection.
          MSG=$(printf 'CI failed\nbranch: %s\nsha:    %s\nglibc:  %s\nbionic: %s\n\n--- glibc failures ---\n%s\n\n--- bionic failures ---\n%s\n\nRun: %s\n' \
            "$BRANCH" "$SHA" "$GLIBC" "$BIONIC" "$FAILS_GLIBC" "$FAILS_BIONIC" "$RUN_URL")

          if [ ${#MSG} -gt 4000 ]; then
            MSG="${MSG:0:1800}"$'\n[... truncated ...]\n'"${MSG: -1800}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
