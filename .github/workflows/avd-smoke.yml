name: AVD Smoke

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Private android_vmp ref to annotate in the report'
        required: false
        type: string
        default: 'main'
  schedule:
    # Nightly auxiliary signal. UTC 19:23 = Asia/Shanghai 03:23.
    - cron: '23 19 * * *'

permissions:
  contents: read

jobs:
  avd_smoke:
    name: AVD Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Manual runs are exploratory and must not become a hard gate. Nightly
    # schedule runs are allowed to fail this standalone workflow.
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      TARGET_REF: ${{ github.event.inputs.target_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone private source for provenance
        run: |
          set -euo pipefail
          git clone --depth 50 "$PRIVATE_REPO_URL" src
          cd src
          git fetch origin "$TARGET_REF" --depth 50 || true
          git checkout "$TARGET_REF"
          echo "PRIVATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}

      - name: Note KVM availability
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM available"
            sudo chmod 666 /dev/kvm || true
          else
            echo "KVM unavailable; emulator will run with -accel off"
          fi

      - name: Boot AVD and collect smoke report
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -no-metrics
            -gpu swiftshader_indirect
            -accel off
          script: |
            set -u
            adb wait-for-device
            python3 - <<'PY'
            import json
            import os
            import subprocess

            def adb_shell(*args):
                try:
                    return subprocess.check_output(
                        ["adb", "shell", *args],
                        stderr=subprocess.STDOUT,
                        text=True,
                        timeout=30,
                    ).strip()
                except subprocess.CalledProcessError as exc:
                    return "ERROR: " + (exc.output or "").strip()
                except subprocess.TimeoutExpired:
                    return "ERROR: timeout"

            report = {
                "workflow": "avd-smoke",
                "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
                "target_ref": os.environ.get("TARGET_REF", ""),
                "private_sha": os.environ.get("PRIVATE_SHA", ""),
                "runner_os": os.environ.get("RUNNER_OS", ""),
                "avd": {
                    "api_level": adb_shell("getprop", "ro.build.version.sdk"),
                    "release": adb_shell("getprop", "ro.build.version.release"),
                    "cpu_abi": adb_shell("getprop", "ro.product.cpu.abi"),
                    "cpu_abilist": adb_shell("getprop", "ro.product.cpu.abilist"),
                    "model": adb_shell("getprop", "ro.product.model"),
                    "linker64": adb_shell("sh", "-c", "test -x /system/bin/linker64 && echo present || echo missing"),
                },
                "scope": {
                    "mode": "manual_non_blocking" if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" else "nightly_auxiliary_gate",
                    "does_not_validate_arm64_vmp": True,
                    "does_not_replace_bionic_shim_gate": True,
                    "purpose": "Verify AVD boot, adb control, and Android runtime smoke reporting.",
                },
            }

            with open("avd-smoke-report.json", "w", encoding="utf-8") as f:
                json.dump(report, f, indent=2, sort_keys=True)
                f.write("\n")
            print(json.dumps(report, indent=2, sort_keys=True))
            PY
            adb logcat -d > avd-logcat.txt || true

      - name: Upload AVD smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avd-smoke-${{ github.run_id }}
          path: |
            avd-smoke-report.json
            avd-logcat.txt
          retention-days: 14
          if-no-files-found: warn
