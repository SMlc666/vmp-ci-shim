name: CI

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full 40-character private-repository commit SHA to test'
        required: true
        type: string
      branch:
        description: 'Branch name for context only'
        required: false
        type: string
        default: 'main'
      layer:
        description: 'CI layer to run'
        required: false
        type: choice
        options:
          - all
          - unit
          - e2e
        default: all
      e2e_instances:
        description: 'Number of independent E2E runners (1, 2, or 4)'
        required: false
        type: choice
        options:
          - '1'
          - '2'
          - '4'
        default: '2'
      oracle_litmus:
        description: 'Run the Cat 2B differential-oracle litmus on bionic'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.inputs.commit_sha }}-${{ github.event.inputs.layer || 'all' }}-${{ github.event.inputs.e2e_instances || '2' }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  e2e_plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          E2E_INSTANCES: ${{ inputs.e2e_instances || '2' }}
        run: |
          set -euo pipefail
          case "$E2E_INSTANCES" in
            1) matrix='{"shard":[0]}' ;;
            2) matrix='{"shard":[0,1]}' ;;
            4) matrix='{"shard":[0,1,2,3]}' ;;
            *) echo "E2E_PLAN_FAILURE: unsupported e2e_instances=$E2E_INSTANCES" >&2; exit 2 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  public_demo:
    if: ${{ inputs.layer == 'all' || inputs.layer == 'unit' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path examples/hello-arm64/Cargo.toml --quiet

  glibc_unit:
    if: ${{ inputs.layer == 'all' || inputs.layer == 'unit' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      - name: Clone and verify private source
        id: checkout_private
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: .github/scripts/checkout-private.sh "$PRIVATE_REPO_URL" "$COMMIT_SHA" src
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: Run Rust unit layer
        id: unit
        working-directory: src
        run: |
          set -euo pipefail
          cargo build -p vmp-lifter --bins --quiet
          cargo test --workspace --lib --bins --quiet -- \
            --skip tests::e2e \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/unit-glibc.log
      - name: Upload glibc unit log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-log-glibc-${{ inputs.commit_sha }}
          path: /tmp/unit-glibc.log
          retention-days: 7
          if-no-files-found: ignore

  bionic_unit:
    if: ${{ inputs.layer == 'all' || inputs.layer == 'unit' }}
    runs-on: ubuntu-24.04-arm
    env:
      TERMUX_PREFIX: /data/data/com.termux/files/usr
      PREFIX: /data/data/com.termux/files/usr
      TERMUX_HOME: /data/data/com.termux/files/home
      BIONIC_IMAGE: ghcr.io/smlc666/termux-rust:v5
      BIONIC_CACHE_VERSION: v8-image-v5
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      - name: Clone and verify private source
        id: checkout_private
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: .github/scripts/checkout-private.sh "$PRIVATE_REPO_URL" "$COMMIT_SHA" src
      - name: Install and verify HTTP proxy
        run: |
          set -euo pipefail
          sudo apt-get install -y tinyproxy >/dev/null
          sudo bash -c 'printf "%s\n" "User tinyproxy" "Group tinyproxy" "Port 3128" "Listen 127.0.0.1" "Timeout 600" "LogLevel Warning" "PidFile \"/run/tinyproxy/tinyproxy.pid\"" "MaxClients 100" "Allow 127.0.0.1" "ConnectPort 443" "ConnectPort 80" "DisableViaHeader Yes" > /etc/tinyproxy/tinyproxy.conf'
          sudo systemctl restart tinyproxy
          sudo systemctl is-active tinyproxy
          curl -fsSI --max-time 15 -x http://127.0.0.1:3128 https://github.com >/dev/null
      - name: Restore bionic userland cache
        id: bionic_cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/bionic-userland.tar
          key: bionic-userland-${{ env.BIONIC_CACHE_VERSION }}-${{ hashFiles('docker/Dockerfile') }}
      - name: Log in to ghcr.io
        if: steps.bionic_cache.outputs.cache-hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Extract bionic userland from image
        if: steps.bionic_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker pull "$BIONIC_IMAGE"
          docker create --name termux-extract "$BIONIC_IMAGE" sleep infinity
          sudo mkdir -p /data/data/com.termux
          sudo docker cp termux-extract:/data/data/com.termux/files /data/data/com.termux/files
          sudo docker cp termux-extract:/system /system
          docker rm termux-extract
          sudo chown -R "$USER:$USER" /data/data/com.termux
          test -e /system/bin/linker64
          "$TERMUX_PREFIX/bin/rustc" --version
          "$TERMUX_PREFIX/bin/cargo" --version
          "$TERMUX_PREFIX/bin/git" --version
          sudo tar -cf /tmp/bionic-userland.tar /data/data/com.termux /system 2>/dev/null
      - name: Save bionic userland cache
        if: steps.bionic_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/bionic-userland.tar
          key: bionic-userland-${{ env.BIONIC_CACHE_VERSION }}-${{ hashFiles('docker/Dockerfile') }}
      - name: Restore bionic userland cache hit
        if: steps.bionic_cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          test -s /tmp/bionic-userland.tar
          sudo tar -xf /tmp/bionic-userland.tar -C /
          sudo chown -R "$USER:$USER" /data/data/com.termux
          "$TERMUX_PREFIX/bin/rustc" --version
          "$TERMUX_PREFIX/bin/cargo" --version
      - name: Restore bionic cargo cache
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /data/data/com.termux/files/home/.cargo/registry
            /data/data/com.termux/files/home/.cargo/git
            /data/data/com.termux/files/home/target
          key: cargo-bionic-${{ hashFiles('src/Cargo.lock') }}-${{ inputs.commit_sha }}
          restore-keys: |
            cargo-bionic-${{ hashFiles('src/Cargo.lock') }}-
            cargo-bionic-
      - name: Create LD-clean host compiler wrappers
        run: .github/scripts/create-ld-clean-wrappers.sh
      - name: Configure bionic toolchain
        run: .github/scripts/configure-bionic-env.sh
      - name: Run Rust unit layer against bionic
        id: unit
        working-directory: src
        run: |
          set -euo pipefail
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:/tmp/host-toolchain-cleanbin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"
          export HTTPS_PROXY=http://127.0.0.1:3128
          export HTTP_PROXY=http://127.0.0.1:3128
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TERMUX_PREFIX/bin/clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TERMUX_PREFIX/bin/llvm-ar"
          export CARGO_TARGET_DIR="$TERMUX_HOME/target"
          mkdir -p "$TERMUX_HOME/target"
          ln -sfn "$TERMUX_HOME/target" "$GITHUB_WORKSPACE/src/target"
          cargo build -p vmp-lifter --bins --quiet
          cargo test --workspace --lib --bins --quiet -- \
            --skip tests::e2e \
            --skip byte_identical \
            --skip _ndk_ \
            --skip _bytecode_ \
            --skip pattern_b_assemble \
            --skip v13_regalloc_pipeline_wiring \
            --skip proc_maps_test \
            2>&1 | tee /tmp/unit-bionic.log
      - name: Save bionic cargo cache
        if: ${{ always() && steps.cargo_cache.outcome == 'success' && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /data/data/com.termux/files/home/.cargo/registry
            /data/data/com.termux/files/home/.cargo/git
            /data/data/com.termux/files/home/target
          key: cargo-bionic-${{ hashFiles('src/Cargo.lock') }}-${{ inputs.commit_sha }}
      - name: Upload bionic unit log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-log-bionic-${{ inputs.commit_sha }}
          path: /tmp/unit-bionic.log
          retention-days: 7
          if-no-files-found: ignore

  glibc_e2e:
    if: ${{ inputs.layer == 'all' || inputs.layer == 'e2e' }}
    needs: e2e_plan
    name: glibc_e2e (shard ${{ matrix.shard }}/${{ inputs.e2e_instances || '2' }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e_plan.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      - name: Clone and verify private source
        id: checkout_private
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: .github/scripts/checkout-private.sh "$PRIVATE_REPO_URL" "$COMMIT_SHA" src
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: glibc-e2e
      - name: Restore glibc realib dependency cache
        id: realib_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/sqlite-amalgamation-3450300
            /tmp/openssl-1.1.1w
            /tmp/zlib-1.3.1
            /tmp/yaml-cpp-0.9.0
            /tmp/protobuf-31.1
            /tmp/zlib-system
          key: realib-extdeps-glibc-layered-v1-${{ hashFiles('src/tests/realib_fixtures/**', 'src/vmp-lifter/tests/realib_*', 'src/vmp-lifter/tests/realib_common/**') }}
      - name: Restore glibc EH fixture cache
        id: eh_cache
        uses: actions/cache/restore@v4
        with:
          path: src/tests/cpp_fixtures/eh_fixture/build
          key: eh-fixture-glibc-${{ hashFiles('src/tests/cpp_fixtures/eh_fixture/**') }}
      - name: Prepare glibc Python scanner
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vmp-python"
          "$RUNNER_TEMP/vmp-python/bin/pip" install --disable-pip-version-check --no-input pyelftools
      - name: Prepare glibc realib dependencies
        env:
          REALIB_LIBC: glibc
        run: .github/scripts/prepare-realib-deps.sh
      - name: Build E2E targets once
        working-directory: src
        env:
          E2E_INSTANCES: ${{ inputs.e2e_instances || '2' }}
          E2E_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/e2e-shard-plan.sh"
          e2e_shard_plan "$E2E_INSTANCES" "$E2E_SHARD"
          printf 'E2E shard %s/%s targets: %s\n' "$E2E_SHARD" "$E2E_INSTANCES" "${E2E_TARGETS[*]}"
          "$GITHUB_WORKSPACE/.github/scripts/build-e2e-targets.sh" "${E2E_TARGETS[@]}"
      - name: Run glibc EH and realib e2e layer
        working-directory: src
        env:
          E2E_INSTANCES: ${{ inputs.e2e_instances || '2' }}
          E2E_SHARD: ${{ matrix.shard }}
          VMP_REALIB_E2E: "1"
          VMP_REALIB_ISOLATE_FIXTURES: "1"
          VMP_REALIB_BASELINE_CACHE: /tmp/vmp-realib-baselines-${{ inputs.commit_sha }}
          VMP_REALIB_PYTHON: ${{ runner.temp }}/vmp-python/bin/python
          OBJCOPY: objcopy
          VMP_REALIB_SERIAL_TARGETS: "realib_matrix_e2e"
          VMP_REALIB_TEST_THREADS: "2"
          CC: gcc
          TEST_LOG: /tmp/test.log
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/e2e-shard-plan.sh"
          e2e_shard_plan "$E2E_INSTANCES" "$E2E_SHARD"
          "$GITHUB_WORKSPACE/.github/scripts/run-e2e-targets.sh" "${E2E_RUNS[@]}"
      - name: Check glibc e2e gate
        env:
          E2E_INSTANCES: ${{ inputs.e2e_instances || '2' }}
          E2E_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/e2e-shard-plan.sh"
          e2e_shard_plan "$E2E_INSTANCES" "$E2E_SHARD"
          "$GITHUB_WORKSPACE/.github/scripts/realib-gate.sh" /tmp/test.log "${E2E_SUITES[@]}"
      - name: Save glibc realib dependency cache
        if: ${{ always() && matrix.shard == 0 && steps.realib_cache.outcome == 'success' && steps.realib_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/sqlite-amalgamation-3450300
            /tmp/openssl-1.1.1w
            /tmp/zlib-1.3.1
            /tmp/yaml-cpp-0.9.0
            /tmp/protobuf-31.1
            /tmp/zlib-system
          key: realib-extdeps-glibc-layered-v1-${{ hashFiles('src/tests/realib_fixtures/**', 'src/vmp-lifter/tests/realib_*', 'src/vmp-lifter/tests/realib_common/**') }}
      - name: Save glibc EH fixture cache
        if: ${{ always() && matrix.shard == 0 && steps.eh_cache.outcome == 'success' && steps.eh_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: src/tests/cpp_fixtures/eh_fixture/build
          key: eh-fixture-glibc-${{ hashFiles('src/tests/cpp_fixtures/eh_fixture/**') }}
      - name: Upload glibc e2e log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log-glibc-${{ inputs.commit_sha }}-${{ matrix.shard }}
          path: /tmp/test.log
          retention-days: 7
          if-no-files-found: ignore

  bionic_e2e:
    if: ${{ inputs.layer == 'all' || inputs.layer == 'e2e' }}
    needs: e2e_plan
    name: bionic_e2e (shard ${{ matrix.shard }}/${{ inputs.e2e_instances || '2' }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e_plan.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    env:
      TERMUX_PREFIX: /data/data/com.termux/files/usr
      PREFIX: /data/data/com.termux/files/usr
      TERMUX_HOME: /data/data/com.termux/files/home
      BIONIC_IMAGE: ghcr.io/smlc666/termux-rust:v5
      BIONIC_CACHE_VERSION: v8-image-v5
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      - name: Trust GitHub host key
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      - name: Clone and verify private source
        id: checkout_private
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: .github/scripts/checkout-private.sh "$PRIVATE_REPO_URL" "$COMMIT_SHA" src
      - name: Install and verify HTTP proxy
        run: |
          set -euo pipefail
          sudo apt-get install -y tinyproxy >/dev/null
          sudo bash -c 'printf "%s\n" "User tinyproxy" "Group tinyproxy" "Port 3128" "Listen 127.0.0.1" "Timeout 600" "LogLevel Warning" "PidFile \"/run/tinyproxy/tinyproxy.pid\"" "MaxClients 100" "Allow 127.0.0.1" "ConnectPort 443" "ConnectPort 80" "DisableViaHeader Yes" > /etc/tinyproxy/tinyproxy.conf'
          sudo systemctl restart tinyproxy
          sudo systemctl is-active tinyproxy
          curl -fsSI --max-time 15 -x http://127.0.0.1:3128 https://github.com >/dev/null
      - name: Restore bionic userland cache
        id: bionic_cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/bionic-userland.tar
          key: bionic-userland-${{ env.BIONIC_CACHE_VERSION }}-${{ hashFiles('docker/Dockerfile') }}
      - name: Log in to ghcr.io
        if: steps.bionic_cache.outputs.cache-hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Extract bionic userland from image
        if: steps.bionic_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker pull "$BIONIC_IMAGE"
          docker create --name termux-extract "$BIONIC_IMAGE" sleep infinity
          sudo mkdir -p /data/data/com.termux
          sudo docker cp termux-extract:/data/data/com.termux/files /data/data/com.termux/files
          sudo docker cp termux-extract:/system /system
          docker rm termux-extract
          sudo chown -R "$USER:$USER" /data/data/com.termux
          test -e /system/bin/linker64
          "$TERMUX_PREFIX/bin/rustc" --version
          "$TERMUX_PREFIX/bin/cargo" --version
          "$TERMUX_PREFIX/bin/git" --version
          sudo tar -cf /tmp/bionic-userland.tar /data/data/com.termux /system 2>/dev/null
      - name: Save bionic userland cache
        if: ${{ matrix.shard == 0 && steps.bionic_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/bionic-userland.tar
          key: bionic-userland-${{ env.BIONIC_CACHE_VERSION }}-${{ hashFiles('docker/Dockerfile') }}
      - name: Restore bionic userland cache hit
        if: steps.bionic_cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          test -s /tmp/bionic-userland.tar
          sudo tar -xf /tmp/bionic-userland.tar -C /
          sudo chown -R "$USER:$USER" /data/data/com.termux
          "$TERMUX_PREFIX/bin/rustc" --version
          "$TERMUX_PREFIX/bin/cargo" --version
      - name: Restore bionic cargo cache
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /data/data/com.termux/files/home/.cargo/registry
            /data/data/com.termux/files/home/.cargo/git
            /data/data/com.termux/files/home/target
          key: cargo-bionic-${{ hashFiles('src/Cargo.lock') }}-${{ inputs.commit_sha }}-e2e-${{ matrix.shard }}
          restore-keys: |
            cargo-bionic-${{ hashFiles('src/Cargo.lock') }}-${{ inputs.commit_sha }}-e2e-
            cargo-bionic-${{ hashFiles('src/Cargo.lock') }}-
            cargo-bionic-
      - name: Restore bionic realib dependency cache
        id: realib_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/sqlite-amalgamation-3450300
            /tmp/openssl-1.1.1w
            /tmp/zlib-1.3.1
            /tmp/yaml-cpp-0.9.0
            /tmp/protobuf-31.1
          key: realib-extdeps-bionic-layered-v1-${{ hashFiles('docker/Dockerfile', 'src/tests/realib_fixtures/**', 'src/vmp-lifter/tests/realib_*', 'src/vmp-lifter/tests/realib_common/**') }}
      - name: Restore bionic EH fixture cache
        id: eh_cache
        uses: actions/cache/restore@v4
        with:
          path: src/tests/cpp_fixtures/eh_fixture/build
          key: eh-fixture-bionic-${{ hashFiles('src/tests/cpp_fixtures/eh_fixture/**') }}
      - name: Create LD-clean host compiler wrappers
        run: .github/scripts/create-ld-clean-wrappers.sh
      - name: Configure bionic toolchain
        run: .github/scripts/configure-bionic-env.sh
      - name: Prepare bionic Python scanner
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vmp-python"
          "$RUNNER_TEMP/vmp-python/bin/pip" install --disable-pip-version-check --no-input pyelftools
      - name: Prepare bionic realib dependencies
        env:
          REALIB_LIBC: bionic
        run: .github/scripts/prepare-realib-deps.sh
      - name: Build E2E targets once
        working-directory: src
        env:
          E2E_INSTANCES: ${{ inputs.e2e_instances || '2' }}
          E2E_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/e2e-shard-plan.sh"
          e2e_shard_plan "$E2E_INSTANCES" "$E2E_SHARD"
          printf 'E2E shard %s/%s targets: %s\n' "$E2E_SHARD" "$E2E_INSTANCES" "${E2E_TARGETS[*]}"
          env -u LD_LIBRARY_PATH \
            BIONIC_MODE=1 \
            BIONIC_PREFIX="$TERMUX_PREFIX" \
            BIONIC_HOME="$TERMUX_HOME" \
            CARGO_TARGET_DIR="$TERMUX_HOME/target" \
            "$GITHUB_WORKSPACE/.github/scripts/build-e2e-targets.sh" "${E2E_TARGETS[@]}"
      - name: Run bionic EH and realib e2e layer
        working-directory: src
        env:
          E2E_INSTANCES: ${{ inputs.e2e_instances || '2' }}
          E2E_SHARD: ${{ matrix.shard }}
          VMP_REALIB_E2E: "1"
          VMP_REALIB_ISOLATE_FIXTURES: "1"
          VMP_REALIB_BASELINE_CACHE: /data/data/com.termux/files/usr/tmp/vmp-realib-baselines-${{ inputs.commit_sha }}
          VMP_REALIB_PYTHON: ${{ runner.temp }}/vmp-python/bin/python
          OBJCOPY: objcopy
          VMP_REALIB_SERIAL_TARGETS: "realib_matrix_e2e"
          VMP_REALIB_TEST_THREADS: "2"
          CC: /data/data/com.termux/files/usr/bin/clang
          CXX: /data/data/com.termux/files/usr/bin/clang++
          TEST_LOG: /tmp/test.log
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/e2e-shard-plan.sh"
          e2e_shard_plan "$E2E_INSTANCES" "$E2E_SHARD"
          env -u LD_LIBRARY_PATH \
            BIONIC_MODE=1 \
            BIONIC_PREFIX="$TERMUX_PREFIX" \
            BIONIC_HOME="$TERMUX_HOME" \
            CARGO_TARGET_DIR="$TERMUX_HOME/target" \
            "$GITHUB_WORKSPACE/.github/scripts/run-e2e-targets.sh" "${E2E_RUNS[@]}"
      - name: Check bionic e2e gate
        env:
          E2E_INSTANCES: ${{ inputs.e2e_instances || '2' }}
          E2E_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/e2e-shard-plan.sh"
          e2e_shard_plan "$E2E_INSTANCES" "$E2E_SHARD"
          "$GITHUB_WORKSPACE/.github/scripts/realib-gate.sh" /tmp/test.log "${E2E_SUITES[@]}"
      - name: Run optional Cat 2B oracle litmus
        if: ${{ inputs.oracle_litmus && matrix.shard == 0 }}
        working-directory: src
        env:
          VMP_ORACLE_LITMUS: "1"
        run: |
          set -euo pipefail
          export HOME="$TERMUX_HOME"
          export PATH="$TERMUX_PREFIX/bin:/tmp/host-toolchain-cleanbin:$PATH"
          export LD_LIBRARY_PATH="$TERMUX_PREFIX/lib"
          export CARGO_TARGET_DIR="$TERMUX_HOME/target"
          cargo test -p vmp-lifter --test oracle_litmus -- --nocapture
      - name: Save bionic realib dependency cache
        if: ${{ always() && matrix.shard == 0 && steps.realib_cache.outcome == 'success' && steps.realib_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/sqlite-amalgamation-3450300
            /tmp/openssl-1.1.1w
            /tmp/zlib-1.3.1
            /tmp/yaml-cpp-0.9.0
            /tmp/protobuf-31.1
          key: realib-extdeps-bionic-layered-v1-${{ hashFiles('docker/Dockerfile', 'src/tests/realib_fixtures/**', 'src/vmp-lifter/tests/realib_*', 'src/vmp-lifter/tests/realib_common/**') }}
      - name: Save bionic cargo cache
        if: ${{ always() && steps.cargo_cache.outcome == 'success' && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /data/data/com.termux/files/home/.cargo/registry
            /data/data/com.termux/files/home/.cargo/git
            /data/data/com.termux/files/home/target
          key: cargo-bionic-${{ hashFiles('src/Cargo.lock') }}-${{ inputs.commit_sha }}-e2e-${{ matrix.shard }}
      - name: Save bionic EH fixture cache
        if: ${{ always() && matrix.shard == 0 && steps.eh_cache.outcome == 'success' && steps.eh_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: src/tests/cpp_fixtures/eh_fixture/build
          key: eh-fixture-bionic-${{ hashFiles('src/tests/cpp_fixtures/eh_fixture/**') }}
      - name: Package bionic diagnostics
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/bionic-diagnostics
          if [[ -f /tmp/test.log ]]; then
            cp /tmp/test.log /tmp/bionic-diagnostics/test.log
          else
            printf 'No e2e log was produced; inspect the failing setup step.\n' > /tmp/bionic-diagnostics/test.log
          fi
          if [[ -x "$TERMUX_HOME/target/debug/vmp-runner" ]]; then
            cp -a "$TERMUX_HOME/target/debug/vmp-runner" /tmp/bionic-diagnostics/vmp-runner
          fi
          if [[ -d src/vmp-lifter/fixtures/e2e ]]; then
            tar czf /tmp/bionic-diagnostics/e2e-fixtures.tar.gz \
              -C src/vmp-lifter/fixtures e2e/
          fi
          tar czf /tmp/e2e-fixtures-bionic.tar.gz -C /tmp bionic-diagnostics
      - name: Upload bionic e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-bionic-${{ inputs.commit_sha }}-${{ matrix.shard }}
          path: /tmp/e2e-fixtures-bionic.tar.gz
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload bionic e2e log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log-bionic-${{ inputs.commit_sha }}-${{ matrix.shard }}
          path: /tmp/test.log
          retention-days: 7
          if-no-files-found: ignore

  notify_failure:
    needs: [e2e_plan, public_demo, glibc_unit, bionic_unit, glibc_e2e, bionic_e2e]
    if: ${{ always() && (needs.e2e_plan.result == 'failure' || needs.public_demo.result == 'failure' || needs.glibc_unit.result == 'failure' || needs.bionic_unit.result == 'failure' || needs.glibc_e2e.result == 'failure' || needs.bionic_e2e.result == 'failure') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Send Telegram alert
        env:
          E2E_PLAN: ${{ needs.e2e_plan.result }}
          PUBLIC: ${{ needs.public_demo.result }}
          GLIBC_UNIT: ${{ needs.glibc_unit.result }}
          BIONIC_UNIT: ${{ needs.bionic_unit.result }}
          GLIBC_E2E: ${{ needs.glibc_e2e.result }}
          BIONIC_E2E: ${{ needs.bionic_e2e.result }}
          BRANCH: ${{ inputs.branch }}
          LAYER: ${{ inputs.layer }}
          SHA: ${{ inputs.commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          MSG=$(printf 'CI failed\nbranch: %s\nlayer:  %s\nsha:    %s\ne2e plan: %s\npublic: %s\nglibc unit:  %s\nbionic unit: %s\nglibc e2e:   %s\nbionic e2e:  %s\n\nRun: %s\n' \
            "$BRANCH" "$LAYER" "$SHA" "$E2E_PLAN" "$PUBLIC" "$GLIBC_UNIT" "$BIONIC_UNIT" "$GLIBC_E2E" "$BIONIC_E2E" "$RUN_URL")
          if [ ${#MSG} -gt 4000 ]; then MSG="${MSG:0:3900}"; fi
          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
